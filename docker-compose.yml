name: voice2text-project
services:
  whisper:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper
    restart: no
    ports:
      - "0.0.0.0:8080:9000/tcp"
    volumes:
      - $HOME/whisper:/var/lib/whisper
    environment:
      WHISPER_MODEL: large-v3
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_API_KEY : ""
      WHISPER_DIARIZATION: false
      WHISPER_VAD_FILTER: true
      # WHISPER_DIARIZE_NUM_SPEAKERS: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
